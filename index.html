<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dino Run</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="intro">
        <p class="session-label">DevStart 2026</p>
        <h1>Dino Run</h1>
        <p>Jump over the field rocks and keep the expedition moving.</p>
      </header>

      <section class="game-card" aria-labelledby="game-title">
        <div class="scoreboard">
          <h2 id="game-title">Field run</h2>
          <p>Score: <strong id="score">0</strong></p>
        </div>

        <div
          class="game-stage"
          id="game-stage"
          tabindex="0"
          aria-label="Dinosaur runner game. Press Space or the up arrow to jump."
        >
          <div class="cloud cloud-one" aria-hidden="true"></div>
          <div class="cloud cloud-two" aria-hidden="true"></div>
          <div class="dino" id="dino" aria-label="Dinosaur">
            <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
              <g class="dino-art">
                <path d="M40 58C24 56 12 48 5 36c3 16 16 30 35 34z" fill="#f2a7be" />
                <g class="dino-leg dino-leg-back">
                  <path d="M38 68h12a8 8 0 0 1 8 8v14a6 6 0 0 1-6 6H36a6 6 0 0 1-6-6V76a8 8 0 0 1 8-8z" fill="#e89ab3" />
                </g>
                <ellipse cx="54" cy="60" rx="25" ry="21" fill="#f2a7be" />
                <ellipse cx="60" cy="64" rx="13" ry="11" fill="#fff7cf" />
                <g class="dino-leg dino-leg-front">
                  <path d="M58 68h12a8 8 0 0 1 8 8v14a6 6 0 0 1-6 6H56a6 6 0 0 1-6-6V76a8 8 0 0 1 8-8z" fill="#f2a7be" />
                </g>
                <path d="M66 50c6-1 10 2 12 6-5 2-10 1-13-2z" fill="#eb9bb4" />
                <circle cx="74" cy="34" r="20" fill="#f2a7be" />
                <ellipse cx="88" cy="42" rx="11" ry="9" fill="#f2a7be" />
                <ellipse cx="69" cy="41" rx="5" ry="3" fill="#e08faa" opacity="0.45" />
                <circle cx="78" cy="28" r="6" fill="#fffdf7" />
                <circle cx="80" cy="29" r="3" fill="#5b4a66" />
                <circle cx="95" cy="39" r="1.6" fill="#5b4a66" opacity="0.55" />
                <path d="M86 47c4 2 8 2 12 0" stroke="#5b4a66" stroke-width="2.5" stroke-linecap="round" fill="none" />
              </g>
            </svg>
          </div>
          <div class="obstacle" id="obstacle" aria-label="Rock">🪨</div>
          <div class="ground" aria-hidden="true"></div>
        </div>

        <div class="controls">
          <button id="start-button" type="button">Start game</button>
          <p id="status" aria-live="polite">Press Start game, then Space or ↑ to jump.</p>
        </div>
      </section>
    </main>
  </body>
</html>
